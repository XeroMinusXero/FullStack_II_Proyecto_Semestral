<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — The Quiet Chapter</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div class="logo">✒️ THE QUIET CHAPTER</div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html">Ingresar</a>
        </nav>
    </header>
    <main style="display:flex;justify-content:center;padding-top:40px;">
        <form data-formulario="registro" style="width:100%;">
            <h1 style="border:none;font-size:1.5rem;">Crear Cuenta</h1>

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" data-validar="requerido,soloLetras" data-min="2" data-max="50">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" data-validar="requerido,soloLetras" data-min="2" data-max="50">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="text" id="email" data-validar="requerido,email">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" data-validar="requerido,telefono">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" data-validar="requerido,passwordFuerte">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" data-validar="requerido">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo" style="flex-direction:row;align-items:center;gap:8px;">
                <input type="checkbox" id="terminos">
                <label for="terminos" style="font-weight:normal;">Acepto los términos y condiciones</label>
            </div>

            <button class="btn" type="submit" style="width:100%;">Registrarme</button>
        </form>
    </main>
    <footer>
        <div>© 2026 The Quiet Chapter</div>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
