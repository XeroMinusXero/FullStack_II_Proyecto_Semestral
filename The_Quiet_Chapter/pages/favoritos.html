        <h1>Mi Lista de Favoritos</h1>

        <div class="grid-libros">
            <div class="card-libro">
                <div class="portada portada-cien-anos">📖</div>

                    <div class="titulo">Cien Años de Soledad</div>
                    <div class="autor">Gabriel García Márquez</div>
                    <div class="precio">$18.900</div>
                    <span class="badge badge-disponible">Disponible</span>
                    <div class="acciones">
                        <button class="btn" data-agregar>Agregar al carrito</button>
                        <button class="btn btn-peligro">Quitar</button>
                    </div>
                </div>
            </div>
            <div class="card-libro">
                <div class="portada portada-1984">📕</div>
                <div class="info">
                    <div class="titulo">1984</div>
                    <div class="autor">George Orwell</div>
                    <div class="precio">$14.500</div>
                    <span class="badge badge-disponible">Disponible</span>
                    <div class="acciones">
                        <button class="btn" data-agregar>Agregar al carrito</button>
                        <button class="btn btn-peligro">Quitar</button>
                    </div>
                </div>
            </div>
            <div class="card-libro">
                <div class="portada portada-sombra-viento">📘</div>
                <div class="info">
                    <div class="titulo">La Sombra del Viento</div>
                    <div class="autor">Carlos Ruiz Zafón</div>
                    <div class="precio">$21.300</div>
                    <span class="badge badge-agotado">Agotado</span>
                    <div class="acciones">
                        <button class="btn" disabled data-agregar>Agregar al carrito</button>
                        <button class="btn btn-peligro">Quitar</button>
                    </div>
                </div>
            </div>
        </div>
