<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — The Quiet Chapter</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div class="logo">✒️ THE QUIET CHAPTER</div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="ofertas.html">Ofertas</a>
        </nav>
    </header>
    <main style="display:flex;justify-content:center;align-items:flex-start;padding-top:40px;">
        <form data-formulario="login" style="width:100%;">
            <h1 style="border:none;font-size:1.5rem;">Iniciar Sesión</h1>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="text" id="email" data-validar="requerido,email" placeholder="correo@ejemplo.com">
                <span class="mensaje-error"></span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" data-validar="requerido" data-min="6" placeholder="Mínimo 6 caracteres">
                <span class="mensaje-error"></span>
            </div>

            <button class="btn" type="submit" style="width:100%;">Ingresar</button>

            <p style="margin-top:14px;text-align:center;font-size:.9rem;">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </p>
            <p style="text-align:center;font-size:.9rem;">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
        </form>
    </main>
    <footer>
        <div>© 2026 The Quiet Chapter</div>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
