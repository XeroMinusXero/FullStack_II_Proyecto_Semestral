<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — The Quiet Chapter</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div class="logo">✒️ THE QUIET CHAPTER</div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="ofertas.html">Ofertas</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="carrito.html" class="cart-link">Carrito <span class="cart-count">2</span></a>
        </nav>
    </header>
    <main>
        <h1>Carrito de Compras</h1>

        <div class="item-carrito">
            <div class="mini-portada portada-cien-anos">📖</div>
            <div>
                <div class="titulo" style="font-weight:bold;">Cien Años de Soledad</div>
                <div class="autor" style="font-size:.9rem;color:var(--cafe-claro);">Gabriel García Márquez</div>
                <div class="precio" style="margin-top:6px;">$18.900</div>
            </div>
            <div class="acciones-item">
                <div class="control-cantidad">
                    <button class="menos">−</button>
                    <input type="number" value="2" min="0" max="12">
                    <button class="mas">+</button>
                </div>
                <div style="margin-top:8px;font-weight:bold;">Subtotal: $37.800</div>
                <button class="btn btn-peligro" style="margin-top:8px;">Eliminar</button>
            </div>
        </div>

        <div class="item-carrito">
            <div class="mini-portada portada-1984">📕</div>
            <div>
                <div class="titulo" style="font-weight:bold;">1984</div>
                <div class="autor" style="font-size:.9rem;color:var(--cafe-claro);">George Orwell</div>
                <div class="precio" style="margin-top:6px;">$14.500</div>
            </div>
            <div class="acciones-item">
                <div class="control-cantidad">
                    <button class="menos">−</button>
                    <input type="number" value="1" min="0" max="8">
                    <button class="mas">+</button>
                </div>
                <div style="margin-top:8px;font-weight:bold;">Subtotal: $14.500</div>
                <button class="btn btn-peligro" style="margin-top:8px;">Eliminar</button>
            </div>
        </div>

        <div style="margin:16px 0;">
            <label style="font-weight:bold;">Cupón de descuento</label>
            <div style="display:flex;gap:8px;margin-top:6px;">
                <input type="text" id="cupon" placeholder="Ingrese código" data-validar="requerido" data-min="4" data-opcional="true"
                    style="flex:1;padding:9px;border:1px solid var(--cafe-claro);border-radius:4px;">
                <button class="btn">Aplicar</button>
            </div>
        </div>

        <div class="resumen-caja">
            <div class="fila"><span>Subtotal</span><span>$52.300</span></div>
            <div class="fila"><span>Envío</span><span>$3.500</span></div>
            <div class="fila"><span>Total</span><span>$55.800</span></div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a href="catalogo.html" class="btn btn-secundario">Seguir comprando</a>
            <button class="btn" data-protegido data-destino="checkoutDireccion">Iniciar compra</button>
            <button class="btn btn-peligro">Vaciar carrito</button>
        </div>
    </main>
    <footer>
        <div>© 2026 The Quiet Chapter</div>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
