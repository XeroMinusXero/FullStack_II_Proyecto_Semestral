spring.application.name=notif-service
server.port=${SERVER_PORT:8087}
server.address=127.0.0.1
spring.datasource.url=${TQC_NOTIF_DB_URL:jdbc:mysql://127.0.0.1:3306/tqc_notif_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL}
spring.datasource.username=${TQC_NOTIF_DB_USER:root}
spring.datasource.password=${TQC_NOTIF_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Seguridad compartida (mismos valores en TODOS los servicios).
tqc.auth.jwt-secret=${TQC_JWT_SECRET:solo-desarrollo-local-tqc-cambiar-por-secreto-aleatorio-2026}
tqc.internal.key=${TQC_INTERNAL_KEY:solo-desarrollo-clave-interna-tqc-2026}
tqc.users.base-url=${TQC_USERS_URL:http://127.0.0.1:8084}
tqc.catalog.base-url=${TQC_CATALOG_URL:http://127.0.0.1:8080}
# Enlaces de los correos simulados (frontend React).
tqc.frontend.url=${TQC_FRONTEND_URL:http://localhost:5173}
