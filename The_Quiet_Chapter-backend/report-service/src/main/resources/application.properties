spring.application.name=report-service
server.port=${SERVER_PORT:8088}
server.address=127.0.0.1

# Seguridad compartida (mismos valores en TODOS los servicios).
tqc.auth.jwt-secret=${TQC_JWT_SECRET:solo-desarrollo-local-tqc-cambiar-por-secreto-aleatorio-2026}
tqc.internal.key=${TQC_INTERNAL_KEY:solo-desarrollo-clave-interna-tqc-2026}
tqc.catalog.base-url=${TQC_CATALOG_URL:http://127.0.0.1:8080}
tqc.orders.base-url=${TQC_ORDERS_URL:http://127.0.0.1:8083}
tqc.users.base-url=${TQC_USERS_URL:http://127.0.0.1:8084}

# --- Swagger / OpenAPI (springdoc) ---
# UI de este servicio: http://127.0.0.1:8088/swagger-ui.html   |   Especificacion JSON: /v3/api-docs
# UI centralizada de todos los servicios (a traves del gateway): http://localhost:8090/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Las rutas internas (servicio-a-servicio) no se documentan ni se exponen.
springdoc.paths-to-exclude=/internal/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
