spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}

# Spring Cloud 2025.1.x se valida contra Boot 4.1.x; se desactiva el verificador para no bloquear parches (4.1.1).
spring.cloud.compatibility-verifier.enabled=false

# Origenes permitidos (frontend Vite).
tqc.cors.origins=${TQC_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Rutas: el path se reenvia tal cual. Ninguna ruta publica /internal/** (llamadas solo entre servicios).
spring.cloud.gateway.server.webmvc.routes[0].id=libros
spring.cloud.gateway.server.webmvc.routes[0].uri=${TQC_CATALOG_URL:http://127.0.0.1:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/libros/**
spring.cloud.gateway.server.webmvc.routes[1].id=carrito
spring.cloud.gateway.server.webmvc.routes[1].uri=${TQC_CART_URL:http://127.0.0.1:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/carrito/**
spring.cloud.gateway.server.webmvc.routes[2].id=checkout
spring.cloud.gateway.server.webmvc.routes[2].uri=${TQC_CHECKOUT_URL:http://127.0.0.1:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/checkout/**
spring.cloud.gateway.server.webmvc.routes[3].id=pedidos
spring.cloud.gateway.server.webmvc.routes[3].uri=${TQC_ORDERS_URL:http://127.0.0.1:8083}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/pedidos/**
spring.cloud.gateway.server.webmvc.routes[4].id=usuarios
spring.cloud.gateway.server.webmvc.routes[4].uri=${TQC_USERS_URL:http://127.0.0.1:8084}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.server.webmvc.routes[5].id=favoritos
spring.cloud.gateway.server.webmvc.routes[5].uri=${TQC_SOCIAL_URL:http://127.0.0.1:8085}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/favoritos/**
spring.cloud.gateway.server.webmvc.routes[6].id=resenas
spring.cloud.gateway.server.webmvc.routes[6].uri=${TQC_SOCIAL_URL:http://127.0.0.1:8085}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/resenas/**
spring.cloud.gateway.server.webmvc.routes[7].id=cupones
spring.cloud.gateway.server.webmvc.routes[7].uri=${TQC_PROMO_URL:http://127.0.0.1:8086}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/cupones/**
spring.cloud.gateway.server.webmvc.routes[8].id=promociones
spring.cloud.gateway.server.webmvc.routes[8].uri=${TQC_PROMO_URL:http://127.0.0.1:8086}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/promociones/**
spring.cloud.gateway.server.webmvc.routes[9].id=recomendaciones
spring.cloud.gateway.server.webmvc.routes[9].uri=${TQC_PROMO_URL:http://127.0.0.1:8086}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/recomendaciones/**
spring.cloud.gateway.server.webmvc.routes[10].id=notificaciones
spring.cloud.gateway.server.webmvc.routes[10].uri=${TQC_NOTIF_URL:http://127.0.0.1:8087}
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/api/notificaciones/**
spring.cloud.gateway.server.webmvc.routes[11].id=boletines
spring.cloud.gateway.server.webmvc.routes[11].uri=${TQC_NOTIF_URL:http://127.0.0.1:8087}
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/api/boletines/**
spring.cloud.gateway.server.webmvc.routes[12].id=reportes
spring.cloud.gateway.server.webmvc.routes[12].uri=${TQC_REPORT_URL:http://127.0.0.1:8088}
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/api/reportes/**

# --- Swagger centralizado ---------------------------------------------------------------
# http://localhost:8090/swagger-ui.html muestra la documentacion de cada servicio en un selector.
# Cada especificacion se pide a traves del gateway: /docs/<servicio>/v3/api-docs -> <servicio>/v3/api-docs
# (StripPrefix=2 quita "/docs/<servicio>"). Solo se expone la documentacion; /internal/** sigue sin ruta.
spring.cloud.gateway.server.webmvc.routes[13].id=docs-catalogo
spring.cloud.gateway.server.webmvc.routes[13].uri=${TQC_CATALOG_URL:http://127.0.0.1:8080}
spring.cloud.gateway.server.webmvc.routes[13].predicates[0]=Path=/docs/catalogo/**
spring.cloud.gateway.server.webmvc.routes[13].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[14].id=docs-carrito
spring.cloud.gateway.server.webmvc.routes[14].uri=${TQC_CART_URL:http://127.0.0.1:8081}
spring.cloud.gateway.server.webmvc.routes[14].predicates[0]=Path=/docs/carrito/**
spring.cloud.gateway.server.webmvc.routes[14].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[15].id=docs-checkout
spring.cloud.gateway.server.webmvc.routes[15].uri=${TQC_CHECKOUT_URL:http://127.0.0.1:8082}
spring.cloud.gateway.server.webmvc.routes[15].predicates[0]=Path=/docs/checkout/**
spring.cloud.gateway.server.webmvc.routes[15].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[16].id=docs-pedidos
spring.cloud.gateway.server.webmvc.routes[16].uri=${TQC_ORDERS_URL:http://127.0.0.1:8083}
spring.cloud.gateway.server.webmvc.routes[16].predicates[0]=Path=/docs/pedidos/**
spring.cloud.gateway.server.webmvc.routes[16].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[17].id=docs-usuarios
spring.cloud.gateway.server.webmvc.routes[17].uri=${TQC_USERS_URL:http://127.0.0.1:8084}
spring.cloud.gateway.server.webmvc.routes[17].predicates[0]=Path=/docs/usuarios/**
spring.cloud.gateway.server.webmvc.routes[17].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[18].id=docs-social
spring.cloud.gateway.server.webmvc.routes[18].uri=${TQC_SOCIAL_URL:http://127.0.0.1:8085}
spring.cloud.gateway.server.webmvc.routes[18].predicates[0]=Path=/docs/social/**
spring.cloud.gateway.server.webmvc.routes[18].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[19].id=docs-promo
spring.cloud.gateway.server.webmvc.routes[19].uri=${TQC_PROMO_URL:http://127.0.0.1:8086}
spring.cloud.gateway.server.webmvc.routes[19].predicates[0]=Path=/docs/promo/**
spring.cloud.gateway.server.webmvc.routes[19].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[20].id=docs-notif
spring.cloud.gateway.server.webmvc.routes[20].uri=${TQC_NOTIF_URL:http://127.0.0.1:8087}
spring.cloud.gateway.server.webmvc.routes[20].predicates[0]=Path=/docs/notif/**
spring.cloud.gateway.server.webmvc.routes[20].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[21].id=docs-reportes
spring.cloud.gateway.server.webmvc.routes[21].uri=${TQC_REPORT_URL:http://127.0.0.1:8088}
spring.cloud.gateway.server.webmvc.routes[21].predicates[0]=Path=/docs/reportes/**
spring.cloud.gateway.server.webmvc.routes[21].filters[0]=StripPrefix=2

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.urls[0].name=Cat\u00e1logo e inventario (catalog-service)
springdoc.swagger-ui.urls[0].url=/docs/catalogo/v3/api-docs
springdoc.swagger-ui.urls[1].name=Carrito (cart-service)
springdoc.swagger-ui.urls[1].url=/docs/carrito/v3/api-docs
springdoc.swagger-ui.urls[2].name=Proceso de compra (checkout-service)
springdoc.swagger-ui.urls[2].url=/docs/checkout/v3/api-docs
springdoc.swagger-ui.urls[3].name=Pedidos (order-service)
springdoc.swagger-ui.urls[3].url=/docs/pedidos/v3/api-docs
springdoc.swagger-ui.urls[4].name=Usuarios y autenticaci\u00f3n (user-service)
springdoc.swagger-ui.urls[4].url=/docs/usuarios/v3/api-docs
springdoc.swagger-ui.urls[5].name=Favoritos y rese\u00f1as (social-service)
springdoc.swagger-ui.urls[5].url=/docs/social/v3/api-docs
springdoc.swagger-ui.urls[6].name=Cupones, promociones y recomendaciones (promo-service)
springdoc.swagger-ui.urls[6].url=/docs/promo/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notificaciones y boletines (notif-service)
springdoc.swagger-ui.urls[7].url=/docs/notif/v3/api-docs
springdoc.swagger-ui.urls[8].name=Reportes (report-service)
springdoc.swagger-ui.urls[8].url=/docs/reportes/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Usuarios y autenticaci\u00f3n (user-service)
