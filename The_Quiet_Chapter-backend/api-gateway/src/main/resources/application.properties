spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}

# Spring Cloud 2025.1.x se valida contra Boot 4.1.x; se desactiva el verificador para no bloquear parches (4.1.1).
spring.cloud.compatibility-verifier.enabled=false

# Origenes permitidos (frontend Vite).
tqc.cors.origins=${TQC_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Rutas: el path se reenvia tal cual. Ninguna ruta publica /internal/** (llamadas solo entre servicios).
spring.cloud.gateway.server.webmvc.routes[0].id=libros
spring.cloud.gateway.server.webmvc.routes[0].uri=${TQC_CATALOG_URL:http://127.0.0.1:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/libros/**
spring.cloud.gateway.server.webmvc.routes[1].id=carrito
spring.cloud.gateway.server.webmvc.routes[1].uri=${TQC_CART_URL:http://127.0.0.1:8081}
