spring.application.name=catalog-service
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

# Base de datos exclusiva de catalog-service en XAMPP (no se modifica el nombre).
spring.datasource.url=${TQC_DB_URL:jdbc:mysql://127.0.0.1:3306/tqc_catalogo_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL}
spring.datasource.username=${TQC_DB_USER:root}
spring.datasource.password=${TQC_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Solo para desarrollo local: Hibernate genera las tablas desde las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Datos de demostracion: desactivar con TQC_DEMO_SEED=false o tqc.demo.seed=false.
tqc.demo.seed=${TQC_DEMO_SEED:true}

# Seguridad compartida (mismos valores en TODOS los servicios). En tu PC puedes definirlos como variables de entorno.
tqc.auth.jwt-secret=${TQC_JWT_SECRET:solo-desarrollo-local-tqc-cambiar-por-secreto-aleatorio-2026}
tqc.internal.key=${TQC_INTERNAL_KEY:solo-desarrollo-clave-interna-tqc-2026}
tqc.orders.base-url=${TQC_ORDERS_URL:http://127.0.0.1:8083}
tqc.notif.base-url=${TQC_NOTIF_URL:http://127.0.0.1:8087}
