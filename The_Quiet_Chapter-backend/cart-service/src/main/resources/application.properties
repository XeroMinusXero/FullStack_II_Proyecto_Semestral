spring.application.name=cart-service
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1

# Base de datos PROPIA. NO consultar directamente tqc_catalogo_db.
spring.datasource.url=${TQC_CART_DB_URL:jdbc:mysql://127.0.0.1:3306/tqc_carrito_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL}
spring.datasource.username=${TQC_CART_DB_USER:root}
spring.datasource.password=${TQC_CART_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Llamada REST REAL al Catalog Service que corre en 8080.
tqc.catalog.base-url=${TQC_CATALOG_URL:http://127.0.0.1:8080}

# Seguridad compartida (mismos valores en TODOS los servicios).
tqc.auth.jwt-secret=${TQC_JWT_SECRET:solo-desarrollo-local-tqc-cambiar-por-secreto-aleatorio-2026}
tqc.internal.key=${TQC_INTERNAL_KEY:solo-desarrollo-clave-interna-tqc-2026}
tqc.promo.base-url=${TQC_PROMO_URL:http://127.0.0.1:8086}
