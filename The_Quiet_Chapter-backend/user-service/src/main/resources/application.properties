spring.application.name=user-service
server.port=${SERVER_PORT:8084}
server.address=127.0.0.1
spring.datasource.url=${TQC_USER_DB_URL:jdbc:mysql://127.0.0.1:3306/tqc_usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL}
spring.datasource.username=${TQC_USER_DB_USER:root}
spring.datasource.password=${TQC_USER_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
# SOLO desarrollo local: en integracion/despliegue definir TQC_JWT_SECRET (minimo 32 bytes).
tqc.auth.jwt-secret=${TQC_JWT_SECRET:solo-desarrollo-local-tqc-cambiar-por-secreto-aleatorio-2026}
tqc.auth.jwt-hours=2
# Clave para llamadas servicio-a-servicio (rutas /internal/**). Misma en TODOS los servicios.
tqc.internal.key=${TQC_INTERNAL_KEY:solo-desarrollo-clave-interna-tqc-2026}
tqc.notif.base-url=${TQC_NOTIF_URL:http://127.0.0.1:8087}
# Administrador inicial (HU-045). Cambiar en tu PC con variables de entorno.
tqc.admin.email=${TQC_ADMIN_EMAIL:admin@thequietchapter.cl}
tqc.admin.password=${TQC_ADMIN_PASSWORD:Admin#2026!}

# --- Swagger / OpenAPI (springdoc) ---
# UI de este servicio: http://127.0.0.1:8084/swagger-ui.html   |   Especificacion JSON: /v3/api-docs
# UI centralizada de todos los servicios (a traves del gateway): http://localhost:8090/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Las rutas internas (servicio-a-servicio) no se documentan ni se exponen.
springdoc.paths-to-exclude=/internal/**
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
